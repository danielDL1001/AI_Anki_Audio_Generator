services:
  anki-audio-generator:
    build: .
    image: anki-audio-generator
    container_name: anki-audio-generator
    stdin_open: true
    tty: true
    environment:
      ANKICONNECT_URL: http://host.docker.internal:8765
      CONFIG_FILE: /data/anki_tts_config.json
    volumes:
      - anki-tts-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"

volumes:
  anki-tts-data:

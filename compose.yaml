services:
  anki-audio-generator:
    build: .
    image: anki-audio-generator
    container_name: anki-audio-generator
    stdin_open: true
    tty: true
    environment:
      # Endereço do AnkiConnect rodando no seu computador (fora do container)
      ANKICONNECT_URL: http://host.docker.internal:8765
      # Guarda a configuração de tipos de nota/campos num volume persistente
      CONFIG_FILE: /data/anki_tts_config.json
      # Voz do Edge-TTS (padrão: pt-BR-FranciscaNeural)
      VOICE: ${VOICE:-pt-BR-FranciscaNeural}
    volumes:
      - anki-tts-data:/data
    extra_hosts:
      # Necessário no Linux; no Docker Desktop (Windows/macOS) já existe
      - "host.docker.internal:host-gateway"
    restart: "no"
 
volumes:
  anki-tts-data:
 
